<!DOCTYPE html>
<html lang="fr">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, shrink-to-fit=no"
    />
    <meta name="theme-color" content="#1a1812" />

    <title>Helmet Legends</title>

    <script src="https://cdn.tailwindcss.com"></script>

    <link rel="manifest" href="manifest.json" />

    <link rel="apple-touch-icon" href="icon-512.png" />

    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta
      name="apple-mobile-web-app-status-bar-style"
      content="black-translucent"
    />
    <meta name="apple-mobile-web-app-title" content="HelmetLegends" />
  </head>

  <body class="bg-[#1a1812]">
    <noscript
      >Vous devez activer JavaScript pour utiliser cette application.</noscript
    >

    <div id="root"></div>

    <script>
      if ("serviceWorker" in navigator) {
        window.addEventListener("load", () => {
          navigator.serviceWorker
            .register("./sw.js")
            .then((reg) => {
              console.log("PWA : Service Worker enregistré avec succès !");
            })
            .catch((err) => {
              console.error(
                "PWA : Erreur lors de l'enregistrement du SW :",
                err
              );
            });
        });
      }
    </script>
    <script
      src="https://upload-widget.cloudinary.com/global/all.js"
      type="text/javascript"
    ></script>
  </body>
</html>
